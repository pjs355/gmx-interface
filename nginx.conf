# SPA — must be default_server so Hosts like clutchcomet.com do not fall through
# to the legacy redirect block (nginx uses the first listen block as default otherwise).
server {
    listen       ${PORT} default_server;
    server_name  clutchcomet.com www.clutchcomet.com _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml image/png;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Dynamic share HTML shell (OG meta + SPA bootstrap) from predictions-api.
    # Prefix locations only — no regex ($ / {24} break nginx:alpine envsubst templates).
    location /predictions/umbrella/ {
        proxy_pass https://prediction-api-production.up.railway.app/og/html/umbrella/;
        proxy_ssl_server_name on;
        proxy_set_header Host prediction-api-production.up.railway.app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Content-Security-Policy;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = /index.html;
        add_header Cache-Control "public, max-age=30";
    }

    # Dynamic OG preview images from predictions-api.
    location /og/umbrella/ {
        proxy_pass https://prediction-api-production.up.railway.app/og/umbrella/;
        proxy_ssl_server_name on;
        proxy_set_header Host prediction-api-production.up.railway.app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=60";
    }

    # SEO artifacts — never fall back to index.html (Google rejects HTML sitemaps).
    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /sitemap.xml {
        default_type application/xml;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

# Legacy domain → canonical site (301). Not default_server — only exact server_name match.
server {
    listen       ${PORT};
    server_name  levelup.markets www.levelup.markets;
    return       301 https://clutchcomet.com$request_uri;
}
