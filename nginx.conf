# SPA — must be default_server so Hosts like clutchcomet.com do not fall through
# to the legacy redirect block (nginx uses the first listen block as default otherwise).
server {
    listen       ${PORT} default_server;
    server_name  clutchcomet.com www.clutchcomet.com _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

# Legacy domain → canonical site (301). Not default_server — only exact server_name match.
server {
    listen       ${PORT};
    server_name  levelup.markets www.levelup.markets;
    return       301 https://clutchcomet.com$request_uri;
}
